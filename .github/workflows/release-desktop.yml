name: Release Windows Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Package Windows Desktop
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Desktop Application & Installer
        run: npm run package:win

      - name: Create GitHub Release & Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-desktop/HUPA-Setup-*.exe
            dist-desktop/HUPA-Setup-*.exe.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true
